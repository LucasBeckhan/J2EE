# 独立前端部署示例：将 npm run build 的 dist 内容放入 /usr/share/nginx/html。
# 如用容器部署，把 127.0.0.1 改为 Java 容器的服务名；后端仍独立运行。
server {
    # 生产入口由 Nginx 提供静态页面；API 仍转发给独立的 Java 进程。
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 保留 /api 前缀，不能在 proxy_pass 的端口后添加斜杠。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        # 传递原始主机与客户端地址供后端记录；这些请求头本身不代表用户身份认证。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 连接建立与读取等待分别设置超时；代理超时也不等于 Java 事务已撤销。
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 优先返回实际静态文件；其余路径返回入口页，便于前端接管导航。
    # 当前页面使用 hash 路由，#orders 不会被浏览器发送给 Nginx。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
