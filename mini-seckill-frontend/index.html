<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport 让手机按设备宽度排版，而非把桌面页面整体缩小。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ef432f" />
    <meta name="description" content="限量好物，即刻开抢。迷你秒杀系统的商品大厅与订单查询。" />
    <title>即刻秒杀 · 限量好物</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23ef432f'/%3E%3Cpath d='M23 6 11 23h9l-3 12 13-19h-9z' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- Vue 的挂载点；初始 HTML 不包含商品数据，App 挂载后通过 API 加载。 -->
    <div id="app"></div>
    <!-- module 入口由 Vite 处理；生产构建后会被改写为 dist/assets 中的打包文件。 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
